<canvas id="c" width="800" height="500" style="background:#111"></canvas>
<div id="info" style="color:black;font-family:sans-serif;margin-top:8px"></div>
<div style="display:flex;gap:10px;max-width:820px">
  <div style="flex:1"><canvas id="popChart"></canvas></div>
  <div style="flex:1"><canvas id="traitChart"></canvas></div>
</div>
<script src="chart.umd.js"></script>
<script>
const ctx = document.getElementById('c').getContext('2d');
const info = document.getElementById('info');
const W = 800, H = 500;
const rand = (a, b) => a + Math.random() * (b - a);

let plants = Array.from({length: 80}, () => ({x: rand(0, W), y: rand(0, H)}));

function makeCreature(x, y, speed, vision) {
  return {x, y, angle: rand(0, Math.PI * 2), speed, vision, energy: 50};
}
let creatures = Array.from({length: 15}, () =>
  makeCreature(rand(0, W), rand(0, H), rand(0.8, 2.2), rand(40, 120)));
const mutate = (v, amt, min, max) => Math.max(min, Math.min(max, v + rand(-amt, amt)));
function update() {
  const babies = [];

  for (const c of creatures) {
    let nearest = null, best = c.vision;
    for (const p of plants) {
      const d = Math.hypot(p.x - c.x, p.y - c.y);
      if (d < best) { best = d; nearest = p; }
    }

    if (nearest) {
      c.angle = Math.atan2(nearest.y - c.y, nearest.x - c.x);
      if (best < 6) {
        plants.splice(plants.indexOf(nearest), 1);
        c.energy += 30;                       // eating gives energy
      }
    } else {
      c.angle += rand(-0.3, 0.3);
    }

    c.x = (c.x + Math.cos(c.angle) * c.speed + W) % W;
    c.y = (c.y + Math.sin(c.angle) * c.speed + H) % H;

    c.energy -= 0.1 + c.speed * 0.03;         // living and moving costs energy

    if (c.energy > 100) {                     // enough energy: reproduce
      c.energy -= 50;
      babies.push(makeCreature(c.x, c.y, mutate(c.speed, 0.2, 0.5, 4), mutate(c.vision, 8, 20, 200)));
    }
  }
  for (const c of creatures) if (c.energy <= 0) deaths.push({x: c.x, y: c.y, life: 30});
  creatures = creatures.filter(c => c.energy > 0).concat(babies);

  if (Math.random() < 0.3 && plants.length < 150)
    plants.push({x: rand(0, W), y: rand(0, H)});
}

let deaths = [];

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = 'limegreen';
  for (const p of plants) ctx.fillRect(p.x, p.y, 4, 4);

  for (const c of creatures) {
    const e = Math.max(0, Math.min(1, c.energy / 60));
    ctx.fillStyle = `rgb(255, ${Math.floor(60 + 195 * e)}, ${Math.floor(60 + 195 * e)})`;
    const s = 3 + c.vision / 25;
    ctx.fillRect(c.x - s / 2, c.y - s / 2, s, s);
  }

  for (const d of deaths) {
    ctx.strokeStyle = `rgba(255, 60, 60, ${d.life / 30})`;
    ctx.beginPath();
    ctx.arc(d.x, d.y, 12 - d.life / 3, 0, Math.PI * 2);
    ctx.stroke();
    d.life--;
  }
  deaths = deaths.filter(d => d.life > 0);
  const avg = k => creatures.length ? (creatures.reduce((s, c) => s + c[k], 0) / creatures.length).toFixed(2) : 0;
  info.textContent = `Creatures: ${creatures.length}   Plants: ${plants.length}   Avg Speed: ${avg('speed')}   Avg Vision: ${avg('vision')}`;
}
const popChart = new Chart(document.getElementById('popChart'), {
  type: 'line',
  data: {labels: [], datasets: [
    {label: 'Creatures', data: [], borderColor: 'crimson', pointRadius: 0},
    {label: 'Plants', data: [], borderColor: 'green', pointRadius: 0}
  ]},
  options: {animation: false}
});

const traitChart = new Chart(document.getElementById('traitChart'), {
  type: 'line',
  data: {labels: [], datasets: [
    {label: 'Avg speed', data: [], borderColor: 'blue', pointRadius: 0, yAxisID: 'y'},
    {label: 'Avg vision', data: [], borderColor: 'orange', pointRadius: 0, yAxisID: 'y1'}
  ]},
  options: {animation: false, scales: {
    y: {position: 'left'},
    y1: {position: 'right', grid: {drawOnChartArea: false}}
  }}
});

let frame = 0;
function record() {
  frame++;
  if (frame % 30 !== 0) return;
  const mean = k => creatures.length
    ? creatures.reduce((s, c) => s + c[k], 0) / creatures.length : 0;
  const add = (chart, vals) => {
    chart.data.labels.push(frame);
    chart.data.datasets.forEach((d, i) => d.data.push(vals[i]));
    if (chart.data.labels.length > 300) {
      chart.data.labels.shift();
      chart.data.datasets.forEach(d => d.data.shift());
    }
    chart.update();
  };
  add(popChart, [creatures.length, plants.length]);
  add(traitChart, [mean('speed'), mean('vision')]);
}
function loop() { update(); draw(); record(); requestAnimationFrame(loop); }
loop();
</script>
